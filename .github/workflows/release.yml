name: Release

# A tag vX.Y.Z on a commit of main builds the distributions, installs the built wheel in a clean environment and
# traces the sample app with it, then publishes to PyPI (environment `pypi`, which requires a maintainer's approval).
# A manual run on main is a dry run: build and verify, no publishing. Publishing uses Trusted Publishing (OIDC):
# there are no PyPI tokens anywhere.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: build and check distributions
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # to check the tag is on main
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: false  # no caches in the release path: nothing a PR could have poisoned
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false  # setup-node v7 caches by default; never in the release path
      - name: the tag matches __version__ and points to a commit on main
        if: github.ref_type == 'tag'
        run: |
          version=$(grep -Po '__version__ = "\K[^"]+' src/vizcontrol/__init__.py)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match __version__ $version"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag $GITHUB_REF_NAME is not on main"; exit 1; }
      - run: uv build  # the build hook runs `npm ci --ignore-scripts` from the lockfile
      - run: uvx twine@7.0.0 check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  verify:
    name: install the built wheel and smoke test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - name: install the exact wheel to be published and trace the sample app
        run: |
          uv venv /tmp/release
          uv pip install --python /tmp/release/bin/python dist/*.whl
          /tmp/release/bin/python -c "from importlib import resources; assert resources.files('vizcontrol').joinpath('viewer/static/index.html').is_file()"
          cd tests/samples/shop
          /tmp/release/bin/vizcontrol run -o /tmp/vip.vizc checkout.py vip || test $? -eq 1
          /tmp/release/bin/vizcontrol info /tmp/vip.vizc | grep -q "escaped   ValueError"

  pypi:
    name: publish to PyPI
    needs: verify
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vizcontrol
    permissions:
      id-token: write  # OIDC for Trusted Publishing; only this job gets it
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
