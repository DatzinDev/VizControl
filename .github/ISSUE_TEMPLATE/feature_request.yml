name: Feature request
description: Something VizControl should show or do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you were trying to understand
      description: The question about your program you couldn't answer with VizControl today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: What you'd like to see or do. Check the [roadmap](https://github.com/DatzinDev/VizControl/blob/main/docs/roadmap.md) first, it may be there.
    validations:
      required: true
