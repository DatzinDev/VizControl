[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vizcontrol"
version = "0.1.0"
description = "Observe what a Python program really does and explore it as an interactive graph."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
vizcontrol = "vizcontrol.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
