[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vizcontrol"
dynamic = ["version"]
description = "Observe what a Python program really does and explore it as an interactive graph."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Datzin", email = "contacto@datzin.com.mx" }]
keywords = ["tracing", "debugging", "visualization", "call-graph", "sys.monitoring", "pytest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/DatzinDev/VizControl"
Documentation = "https://github.com/DatzinDev/VizControl/tree/main/docs"
Issues = "https://github.com/DatzinDev/VizControl/issues"

[project.scripts]
vizcontrol = "vizcontrol.cli:main"

[project.entry-points.pytest11]
vizcontrol = "vizcontrol.pytest_plugin"

[dependency-groups]
dev = [
    "fastapi>=0.156.0",
    "flask>=3.1.3",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "pytest>=8",
    "ruff==0.17.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]  # S: bandit security checks

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "S108", "S310"]  # asserts, subprocesses, temp paths, local http in tests
# SQL text is built only from the schema's constant identifiers; every value is a bound parameter
"src/vizcontrol/store.py" = ["S608"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.version]
path = "src/vizcontrol/__init__.py"  # single source: __version__

[tool.hatch.build]
# the built viewer is git-ignored but must ship in the wheel
artifacts = ["src/vizcontrol/viewer/static/**"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src", "frontend/src", "frontend/*.json", "frontend/*.ts", "frontend/index.html", "hatch_build.py",
           "README.md", "LICENSE", "docs"]
